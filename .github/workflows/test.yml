name: test

on:
  push:
  pull_request:

jobs:
  ert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.4", "30.1"]
        lua: ["lua5.4", "luajit"]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.lua }} love xvfb
      - run: bin/test
        env:
          LUA: ${{ matrix.lua }}
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
      - run: bin/test --cold
        env:
          LUA: ${{ matrix.lua }}
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
      - run: bin/compile-check
  doom:
    # the only check that sees map!, package recipes and init.el: a real doom sync
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.1"
      - uses: actions/checkout@v4
        with:
          repository: doomemacs/doomemacs
          path: .doom
      - uses: actions/cache@v4
        with:
          path: .doom/.local
          key: doom-${{ runner.os }}-${{ hashFiles('init.el', 'packages.el', 'modules/my/*/packages.el') }}
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
      - run: .doom/bin/doom sync
        env:
          DOOMDIR: ${{ github.workspace }}
          EMACSDIR: ${{ github.workspace }}/.doom
      - run: .doom/bin/doom doctor
        env:
          DOOMDIR: ${{ github.workspace }}
          EMACSDIR: ${{ github.workspace }}/.doom
