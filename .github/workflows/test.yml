name: test

on:
  push:
  pull_request:

jobs:
  ert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.4", "30.1"]
        lua: ["lua5.4", "luajit"]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.lua }} love xvfb
      - run: bin/test
        env:
          LUA: ${{ matrix.lua }}
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
      - run: bin/test --cold
        env:
          LUA: ${{ matrix.lua }}
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
      - run: bin/compile-check
  doom:
    # the only check that sees map!, package recipes and init.el: a real doom sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.1"
      # Doom's own modules live in the sources/doom+ submodule
      - uses: actions/checkout@v4
        with:
          repository: doomemacs/doomemacs
          path: .doom
          submodules: true
      - id: doom
        run: echo "sha=$(git -C .doom rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # a .local built by another Doom commit is stale: keep its packages, never its layout
      - uses: actions/cache@v4
        with:
          path: .doom/.local
          key: doom-${{ runner.os }}-${{ steps.doom.outputs.sha }}-${{ hashFiles('init.el', 'packages.el', 'modules/my/*/packages.el') }}
          restore-keys: doom-${{ runner.os }}-${{ steps.doom.outputs.sha }}-
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
      - run: .doom/bin/doom sync
        env:
          DOOMDIR: ${{ github.workspace }}
          EMACSDIR: ${{ github.workspace }}/.doom
      # warnings (!) are about the runner; an error (x) is the config failing to load
      - run: .doom/bin/doom doctor 2>&1 | tee doctor.log && ! grep -q '^  x ' doctor.log
        env:
          DOOMDIR: ${{ github.workspace }}
          EMACSDIR: ${{ github.workspace }}/.doom
